<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #162826 0%, #0e1615 52%, #162826 100%);
        color: #ffffff;
      }
      .wrap {
        display: grid;
        grid-template-columns: 380px 1fr;
        height: 100%;
        align-items: center;
        gap: 48px;
        padding: 56px 72px;
      }
      .portrait {
        width: 320px;
        height: 400px;
        object-fit: cover;
        object-position: center top;
        border-radius: 4px;
        border: 1px solid rgba(232, 245, 243, 0.14);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      }
      .kicker {
        font-size: 18px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #3db8ab;
        margin-bottom: 18px;
      }
      .name {
        font-size: 54px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 20px;
      }
      .role {
        font-size: 30px;
        line-height: 1.25;
        color: #e8f5f3;
        max-width: 620px;
      }
      .role em {
        font-style: normal;
        color: #3db8ab;
      }
      .brand {
        margin-top: 36px;
        font-size: 22px;
        letter-spacing: 0.08em;
        color: rgba(232, 245, 243, 0.72);
      }
      .brand strong {
        color: #ffffff;
        font-weight: 700;
      }
      .line {
        width: 72px;
        height: 3px;
        background: #1d8e82;
        margin-bottom: 28px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="portrait" src="../assets/portrait.jpg" alt="" />
      <div>
        <p class="kicker">Portafolio · 2026</p>
        <div class="line"></div>
        <h1 class="name">Ulises Antonio<br />Ponce Pretelin</h1>
        <p class="role">Fisioterapeuta e <em>Ingeniero de IA clínica</em></p>
        <p class="brand">Creador de <strong>PoncePretelin</strong></p>
      </div>
    </div>
  </body>
</html>
